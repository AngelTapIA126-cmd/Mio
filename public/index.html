<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@700;800&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 60px 28px 40px;
      position: relative;
      overflow: hidden;
    }

    .app::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, #dbeafe 0%, transparent 70%);
      pointer-events: none;
    }

    .app::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: -60px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #dcfce7 0%, transparent 70%);
      pointer-events: none;
    }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
    }

    .bienvenido {
      font-family: 'Poppins', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #111;
      letter-spacing: -0.3px;
      margin-bottom: 24px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 60px;
    }

    .logo-icon {
      width: 56px;
      height: 56px;
    }

    .logo-name {
      font-family: 'Poppins', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: #2563eb;
      letter-spacing: -1px;
    }

    .pregunta {
      font-size: 15px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 20px;
      text-align: center;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.18s ease;
      letter-spacing: 0.2px;
    }

    .btn:active { transform: scale(0.97); }

    .btn-cliente {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 4px 16px rgba(37,99,235,0.25);
    }

    .btn-cliente:hover { background: #1d4ed8; }

    .btn-negocio {
      background: #16a34a;
      color: #fff;
      box-shadow: 0 4px 16px rgba(22,163,74,0.25);
    }

    .btn-negocio:hover { background: #15803d; }

    .btn-repartidor {
      background: #111;
      color: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }

    .btn-repartidor:hover { background: #000; }

    .footer {
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <p class="bienvenido">BIENVENIDO A</p>
      <div class="logo-container">
        <img src="/images/LOGO_DRIVERGO.PNG" style="height:60px;width:auto;"/>
      </div>

      <p class="pregunta">¿Como quieres iniciar sesión?</p>

      <div class="buttons">
        <button class="btn btn-cliente" onclick="window.location.href='/cliente/login.html'">
          Cliente
        </button>
        <button class="btn btn-negocio" onclick="window.location.href='/negocio/login.html'">
          Negocio
        </button>
        <button class="btn btn-repartidor" onclick="window.location.href='/repartidor/login.html'">
          Repartidor
        </button>
      </div>
    </div>

    <p class="footer">Los derechos reservados</p>
  </div>
</body>
</html>
