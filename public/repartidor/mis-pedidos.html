<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo - Mis Pedidos</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .content { padding: 16px 20px 90px; }

    .pedido-card {
      background: #fff;
      border: 1px solid #f3f4f6;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .pedido-card:active { transform: scale(0.98); }

    .badge-entregado {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      background: #dcfce7;
      color: #14532d;
      margin-bottom: 8px;
    }

    .badge-en_proceso {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      background: #ffedd5;
      color: #9a3412;
      margin-bottom: 8px;
    }

    .badge-en_camino {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      background: #dbeafe;
      color: #1e40af;
      margin-bottom: 8px;
    }

    .pedido-titulo {
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .pedido-sub {
      font-size: 12px;
      color: #6b7280;
      font-weight: 600;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      gap: 12px;
      color: #6b7280;
    }

    .empty-state p { font-size: 15px; font-weight: 700; }
    .empty-state span { font-size: 13px; text-align: center; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <span class="header-title">Mis Pedidos</span>
    <div style="width:30px"></div>
  </div>

  <div class="content">
    <div id="pedidos-list">
      <div class="loading"><div class="spinner"></div> Cargando...</div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='/repartidor/home.html'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
    </button>
    <button class="nav-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
      Mis Pedidos
    </button>
  </nav>

</div>

<script src="/js/api.js"></script>
<script>
  const user = getUser();
  if (!user || user.tipo !== 'repartidor') window.location.href = '/repartidor/login.html';

  const estadoLabels = {
    'en_proceso': 'En proceso',
    'en_camino': 'En camino',
    'entregado': 'Entregado',
    'cancelado': 'Cancelado'
  };

  async function cargarPedidos() {
    const pedidos = await apiGet('/pedidos/repartidor');
    const list = document.getElementById('pedidos-list');

    if (!pedidos.length) {
      list.innerHTML = `
        <div class="empty-state">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
          <p>Sin pedidos aún</p>
          <span>Los pedidos que aceptes aparecerán aquí</span>
        </div>`;
      return;
    }

    list.innerHTML = pedidos.map(p => `
      <div class="pedido-card" onclick="verPedido(${p.id}, '${p.estado}', '${p.direccion_envio}', '${p.updated_at}')">
        <span class="badge-${p.estado}">${estadoLabels[p.estado] || p.estado}</span>
        <div class="pedido-titulo">
          ${p.estado === 'entregado'
            ? 'Entregado el ' + formatDate(p.updated_at)
            : 'Pedido de ' + p.cliente_nombre}
        </div>
        <div class="pedido-sub">${p.negocio_nombre} · $${parseFloat(p.total).toFixed(2)}</div>
        <div class="pedido-sub" style="margin-top:4px;">${p.direccion_envio}</div>
      </div>
    `).join('');
  }

  function verPedido(id, estado, direccion, fecha) {
    localStorage.setItem('pedido_repartidor', id);
    if (estado === 'entregado') {
      window.location.href = '/repartidor/pedido-entregado.html';
    } else {
      window.location.href = '/repartidor/seguimiento.html';
    }
  }

  cargarPedidos();
  setInterval(cargarPedidos, 10000);
</script>
</body>
</html>
