<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo - Seguimiento</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .content { padding: 20px 20px 160px; }

    .timeline-wrap {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #f3f4f6;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .btn-entregado {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 380px;
      padding: 16px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      transition: all 0.2s;
      z-index: 99;
    }

    .btn-entregado:hover { background: #000; }
    .btn-entregado:active { transform: translateX(-50%) scale(0.97); }
    .btn-entregado:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <span class="header-title" id="header-titulo">Seguimiento de pedido</span>
    <div style="width:30px"></div>
  </div>

  <div class="content">
    <p style="font-size:13px;font-weight:700;color:#374151;margin-bottom:16px;" id="pedido-label">Pedido ›</p>

    <div class="timeline-wrap">
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <button class="btn-entregado" id="btn-entregado" onclick="marcarEntregado()">
    Marcar como entregado
  </button>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='/repartidor/home.html'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
    </button>
    <button class="nav-btn" onclick="window.location.href='/repartidor/mis-pedidos.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
      Mis Pedidos
    </button>
  </nav>

</div>

<script src="/js/api.js"></script>
<script>
  const user = getUser();
  if (!user || user.tipo !== 'repartidor') window.location.href = '/repartidor/login.html';

  const pedidoId = localStorage.getItem('pedido_repartidor');
  if (!pedidoId) window.location.href = '/repartidor/home.html';

  const pasos = [
    { key: 'pendiente',  label: 'Pendiente' },
    { key: 'recibido',   label: 'Tu pedido fue recibido por el negocio' },
    { key: 'en_proceso', label: 'Aceptado por repartidor' },
    { key: 'en_camino',  label: 'Tu pedido está en camino' },
    { key: 'entregado',  label: 'Tu pedido fue entregado' },
  ];

  const orden = ['pendiente','recibido','buscando_repartidor','en_proceso','en_camino','entregado'];

  function renderTimeline(estado, clienteNombre) {
    const idx = orden.indexOf(estado);
    document.getElementById('pedido-label').textContent = `Pedido de ${clienteNombre} ›`;
    document.getElementById('timeline').innerHTML = pasos.map((p, i) => {
      const realIdx = orden.indexOf(p.key);
      const done = realIdx < idx;
      const active = realIdx === idx;
      return `
        <div class="timeline-item ${done ? 'done' : ''} ${active ? 'active' : ''}">
          <div class="timeline-dot"></div>
          <span class="timeline-text">${p.label}</span>
        </div>`;
    }).join('');

    const btn = document.getElementById('btn-entregado');
    if (estado === 'entregado') {
      btn.disabled = true;
      btn.textContent = 'Pedido entregado ✓';
      setTimeout(() => {
        window.location.href = '/repartidor/mis-pedidos.html';
      }, 2000);
    }
  }

  async function cargarEstado() {
    const pedido = await apiGet(`/pedidos/${pedidoId}`);
    renderTimeline(pedido.estado, pedido.cliente_nombre);
  }

  async function marcarEntregado() {
    const btn = document.getElementById('btn-entregado');
    btn.disabled = true;
    btn.textContent = 'Actualizando...';

    const res = await apiPut(`/pedidos/${pedidoId}/estado`, { estado: 'entregado' });
    if (res.ok) {
      renderTimeline('entregado', '');
    } else {
      btn.disabled = false;
      btn.textContent = 'Marcar como entregado';
      alert('Error al actualizar el pedido');
    }
  }

  cargarEstado();
  setInterval(cargarEstado, 8000);
</script>
</body>
</html>
