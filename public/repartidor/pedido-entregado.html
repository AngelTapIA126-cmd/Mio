<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo - Pedido Entregado</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .content { padding: 20px 20px 100px; }

    .entregado-card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #f3f4f6;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }

    .badge-entregado {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dcfce7;
      color: #14532d;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .entregado-titulo {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #111;
      margin-bottom: 8px;
    }

    .entregado-sub {
      font-size: 13px;
      color: #6b7280;
      font-weight: 600;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <button class="back-btn" onclick="window.location.href='/repartidor/mis-pedidos.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <span class="header-title">Mis Pedidos</span>
    <div style="width:30px"></div>
  </div>

  <div class="content">
    <div class="entregado-card">
      <span class="badge-entregado">Entregado ›</span>
      <div class="entregado-titulo" id="titulo-entregado">Entregado</div>
      <div class="entregado-sub" id="sub-entregado">
        El pedido fue entregado en la dirección indicada.
      </div>
    </div>

    <button class="btn btn-black" onclick="window.location.href='/repartidor/home.html'">
      Buscar más pedidos
    </button>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='/repartidor/home.html'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
    </button>
    <button class="nav-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
      Mis Pedidos
    </button>
  </nav>

</div>

<script src="/js/api.js"></script>
<script>
  const user = getUser();
  if (!user || user.tipo !== 'repartidor') window.location.href = '/repartidor/login.html';

  const pedidoId = localStorage.getItem('pedido_repartidor');

  async function cargarPedido() {
    if (!pedidoId) return;
    const pedido = await apiGet(`/pedidos/${pedidoId}`);
    if (pedido.updated_at) {
      document.getElementById('titulo-entregado').textContent =
        'Entregado el ' + formatDate(pedido.updated_at);
    }
    if (pedido.direccion_envio) {
      document.getElementById('sub-entregado').textContent =
        'El pedido fue entregado en ' + pedido.direccion_envio;
    }
  }

  cargarPedido();
</script>
</body>
</html>
