<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo - Registro Repartidor</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .auth-screen { padding: 40px 28px; }
    .licencia-resultado {
      display: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 8px;
    }
    .licencia-resultado.ok { display: block; background: #dcfce7; color: #14532d; }
    .licencia-resultado.error { display: block; background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
<div class="app">
  <div class="auth-screen">

    <div class="auth-logo">
      <div class="auth-logo-row">
        <img src="/images/LOGO_DRIVERGO.PNG" style="height:90px;width:auto;"/>
      </div>
      <h1 class="auth-title">Crea una cuenta</h1>
      <p class="auth-subtitle">Regístrate para disfrutar de este servicio</p>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <label class="input-label">Ingresa tu nombre completo</label>
    <div class="input-row">
      <input type="text" id="nombres" class="input-field" placeholder="Nombres"/>
      <input type="text" id="apellidos" class="input-field" placeholder="Apellidos"/>
    </div>

    <div class="input-group">
      <label class="input-label">Ingresa tu número de teléfono</label>
      <input type="tel" id="telefono" class="input-field" placeholder="Ej. 999 120 4532"/>
    </div>

    <div class="input-group">
      <label class="input-label">Crea una contraseña</label>
      <input type="password" id="password" class="input-field" placeholder="••••••••••••"/>
    </div>

    <div class="input-group">
      <label class="input-label">Tipo de vehículo</label>
      <select id="tipo_vehiculo" class="input-field">
        <option value="">Selecciona un tipo</option>
        <option value="Motocarro">Motocarro</option>
        <option value="Moto">Moto</option>
        <option value="Bicicleta">Bicicleta</option>
        <option value="Auto">Auto</option>
        <option value="Camioneta">Camioneta</option>
      </select>
    </div>

    <div class="input-group">
      <label class="input-label">Sube tu licencia de ambos lados</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div>
          <label class="upload-field" for="licencia_frente" style="flex-direction:column;gap:4px;text-align:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span id="frente-label" style="font-size:12px;">Frente</span>
          </label>
          <input type="file" id="licencia_frente" accept="image/*" style="display:none" onchange="mostrarNombre(this, 'frente')"/>
        </div>
        <div>
          <label class="upload-field" for="licencia_trasera" style="flex-direction:column;gap:4px;text-align:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span id="trasera-label" style="font-size:12px;">Trasera</span>
          </label>
          <input type="file" id="licencia_trasera" accept="image/*" style="display:none" onchange="mostrarNombre(this, 'trasera')"/>
        </div>
      </div>

      <div class="input-group" style="margin-top:12px;">
        <label class="input-label">Fecha de vencimiento de tu licencia</label>
        <input type="date" id="fecha_vencimiento" class="input-field" onchange="verificarFecha(this.value)"/>
      </div>
      <div class="licencia-resultado" id="licencia-resultado"></div>
    </div>

    <button class="btn btn-black" id="btn-registro" onclick="registro()">Continuar</button>

    <div class="auth-footer">
      ¿Ya tienes cuenta? <a href="/repartidor/login.html" style="color:#111;font-weight:800;">Iniciar Sesión</a>
    </div>

    <p class="auth-terms">
      Al hacer clic en continuar, aceptas nuestros
      <a href="#">Términos de servicio</a> y <a href="#">Política de privacidad</a>
    </p>

  </div>
</div>

<script src="/js/api.js"></script>
<script>
  let licenciaValida = false;

  function mostrarNombre(input, lado) {
    if (!input.files || !input.files[0]) return;
    const label = document.getElementById(lado === 'frente' ? 'frente-label' : 'trasera-label');
    label.textContent = input.files[0].name.substring(0, 14) + '...';
  }

  function verificarFecha(fecha) {
    const resultado = document.getElementById('licencia-resultado');
    if (!fecha) {
      licenciaValida = false;
      resultado.className = 'licencia-resultado';
      return;
    }
    const hoy = new Date();
    const vencimiento = new Date(fecha + 'T00:00:00');
    if (vencimiento > hoy) {
      licenciaValida = true;
      resultado.className = 'licencia-resultado ok';
      resultado.textContent = `✅ Licencia vigente hasta ${vencimiento.toLocaleDateString('es-MX')}`;
    } else {
      licenciaValida = false;
      resultado.className = 'licencia-resultado error';
      resultado.textContent = '❌ Tu licencia está vencida, no puedes registrarte como repartidor';
    }
  }

  async function registro() {
    const nombres = document.getElementById('nombres').value.trim();
    const apellidos = document.getElementById('apellidos').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const password = document.getElementById('password').value.trim();
    const tipo_vehiculo = document.getElementById('tipo_vehiculo').value;
    const licencia_frente = document.getElementById('licencia_frente').files[0];
    const licencia_trasera = document.getElementById('licencia_trasera').files[0];
    const fecha_vencimiento = document.getElementById('fecha_vencimiento').value;
    hideError('error-msg');

    if (!nombres || !apellidos || !telefono || !password || !tipo_vehiculo) {
      showError('error-msg', 'Por favor llena todos los campos');
      return;
    }

    if (!licencia_frente || !licencia_trasera) {
      showError('error-msg', 'Debes subir ambos lados de tu licencia');
      return;
    }

    if (!fecha_vencimiento) {
      showError('error-msg', 'Ingresa la fecha de vencimiento de tu licencia');
      return;
    }

    if (!licenciaValida) {
      showError('error-msg', 'Tu licencia está vencida. No puedes registrarte como repartidor.');
      return;
    }

    if (password.length < 6) {
      showError('error-msg', 'La contraseña debe tener al menos 6 caracteres');
      return;
    }

    const btn = document.getElementById('btn-registro');
    btn.textContent = 'Cargando...';
    btn.disabled = true;

    const formData = new FormData();
    formData.append('nombres', nombres);
    formData.append('apellidos', apellidos);
    formData.append('telefono', telefono);
    formData.append('password', password);
    formData.append('tipo_vehiculo', tipo_vehiculo);
    formData.append('licencia_frente', licencia_frente);
    formData.append('licencia_trasera', licencia_trasera);

    const res = await apiPostForm('/repartidores/registro', formData);

    if (res.ok) {
      saveSession(res.token, { id: res.id, nombres: res.nombres, tipo: 'repartidor' });
      window.location.href = '/repartidor/home.html';
    } else {
      showError('error-msg', res.error || 'Error al crear cuenta');
      btn.textContent = 'Continuar';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
