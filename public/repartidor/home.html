<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo - Repartidor</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .content { padding: 16px 20px 90px; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 0;
    }

    .topbar-search {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f3f4f6;
      border-radius: 12px;
      padding: 10px 14px;
      margin-right: 12px;
    }

    .topbar-search input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
    }

    .logo-icon-sm { width: 36px; height: 36px; }

    .pedido-card {
      background: #fff;
      border: 1px solid #f3f4f6;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .pedido-nombre {
      font-size: 15px;
      font-weight: 800;
      color: #111;
      margin-bottom: 4px;
    }

    .pedido-total {
      font-size: 14px;
      font-weight: 800;
      color: #111;
      margin-bottom: 4px;
    }

    .pedido-dir {
      font-size: 12px;
      color: #6b7280;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .btn-ver {
      padding: 8px 20px;
      background: #f3f4f6;
      border: none;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: #374151;
      transition: background 0.2s;
    }

    .btn-ver:hover { background: #e5e7eb; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      gap: 12px;
      color: #6b7280;
    }

    .empty-state p { font-size: 15px; font-weight: 700; }
    .empty-state span { font-size: 13px; text-align: center; }
  </style>
</head>
<body>
<div class="app">

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" placeholder="Buscar" oninput="filtrar(this.value)"/>
    </div>
    <img src="/images/LOGO_DRIVERGO.png" style="height:36px;width:auto;"/>
    </svg>
  </div>

  <div class="content">
    <div class="section-title">Pedidos disponibles <span>›</span></div>
    <div id="pedidos-list">
      <div class="loading"><div class="spinner"></div> Cargando...</div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
    </button>
    <button class="nav-btn" onclick="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      Perfil
    </button>
  </nav>

</div>

<script src="/js/api.js"></script>
<script>
  const user = getUser();
  if (!user || user.tipo !== 'repartidor') window.location.href = '/repartidor/login.html';

  let todosPedidos = [];

  async function cargarPedidos() {
    const pedidos = await apiGet('/pedidos/disponibles');
    todosPedidos = pedidos;
    renderPedidos(pedidos);
  }

  function renderPedidos(pedidos) {
    const list = document.getElementById('pedidos-list');
    if (!pedidos.length) {
      list.innerHTML = `
        <div class="empty-state">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
          <p>Sin pedidos disponibles</p>
          <span>Cuando un negocio acepte un pedido aparecerá aquí</span>
        </div>`;
      return;
    }

    list.innerHTML = pedidos.map(p => `
      <div class="pedido-card">
        <div class="pedido-nombre">Pedido de ${p.cliente_nombre}</div>
        <div class="pedido-total">Total: $${parseFloat(p.total).toFixed(2)}</div>
        <div class="pedido-dir">${p.direccion_envio}</div>
        <button class="btn-ver" onclick="verPedido(${p.id})">Ver pedido</button>
      </div>
    `).join('');
  }

  function filtrar(q) {
    if (!q) { renderPedidos(todosPedidos); return; }
    renderPedidos(todosPedidos.filter(p =>
      p.cliente_nombre.toLowerCase().includes(q.toLowerCase())
    ));
  }

  function verPedido(id) {
    localStorage.setItem('pedido_repartidor', id);
    window.location.href = '/repartidor/detalle-pedido.html';
  }

  function logout() {
    window.location.href = '/repartidor/perfil.html';
  }

  cargarPedidos();
  setInterval(cargarPedidos, 8000);
</script>
</body>
</html>
