<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo - Repartidores</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .content { padding: 16px 20px 90px; }

    .rep-card {
      background: #fff;
      border: 1px solid #f3f4f6;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .rep-nombre {
      font-size: 15px;
      font-weight: 800;
      color: #111;
      margin-bottom: 4px;
    }

    .rep-status {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .rep-status.disponible { color: #16a34a; }
    .rep-status.no-disponible { color: #9ca3af; }

    .btn-dar {
      padding: 8px 20px;
      background: #f3f4f6;
      border: none;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: #374151;
      transition: background 0.2s;
    }

    .btn-dar:hover { background: #e5e7eb; }
    .btn-dar:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      gap: 12px;
      color: #6b7280;
    }

    .empty-state p { font-size: 15px; font-weight: 700; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <img src="/images/ICONO_DRIVERGO.PNG" style="height:32px;width:auto;"/>
    <div style="width:30px"></div>
  </div>

  <div class="content">
    <div class="section-title">Repartidores disponibles <span>›</span></div>
    <div id="repartidores-list">
      <div class="loading"><div class="spinner"></div> Cargando...</div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='/negocio/home.html'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
    </button>
    <button class="nav-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      Pedidos
    </button>
    <button class="nav-btn" onclick="window.location.href='/negocio/perfil.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      Perfil
    </button>
  </nav>

</div>

<!-- Toast -->
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast">
  <div class="toast-icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
  </div>
  <span class="toast-title" id="toast-title">Pedido asignado correctamente</span>
  <button class="btn btn-green" id="toast-aceptar" style="margin-top:8px;padding:10px 28px;width:auto;" onclick="hideToast()">Aceptar</button>
</div>

<script src="/js/api.js"></script>
<script>
  const user = getUser();
  if (!user || user.tipo !== 'negocio') window.location.href = '/negocio/login.html';

  const pedidoId = localStorage.getItem('pedido_negocio');

  async function cargarRepartidores() {
    const reps = await apiGet('/repartidores/disponibles');
    const list = document.getElementById('repartidores-list');

    if (!reps.length) {
      list.innerHTML = `
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5">
            <circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 10-16 0"/>
          </svg>
          <p>Sin repartidores disponibles</p>
        </div>`;
      return;
    }

    list.innerHTML = reps.map(r => `
      <div class="rep-card">
        <div class="rep-nombre">${r.nombres} ${r.apellidos}</div>
        <div class="rep-status ${r.disponible ? 'disponible' : 'no-disponible'}">
          ${r.disponible ? 'Disponible' : 'No disponible'}
        </div>
        <button class="btn-dar"
          ${!r.disponible ? 'disabled' : ''}
          onclick="darPedido(${r.id})">
          ${r.disponible ? 'Dar pedido' : 'No disponible'}
        </button>
      </div>
    `).join('');
  }

  async function darPedido(repartidorId) {
    if (!pedidoId) return;
    const res = await apiPut(`/pedidos/${pedidoId}/estado`, {
      estado: 'en_proceso',
      repartidor_id: repartidorId
    });

    if (res.ok) {
      showToast('Pedido asignado correctamente', () => {
        window.location.href = '/negocio/proceso-pedido.html';
      });
    }
  }

  cargarRepartidores();
</script>
</body>
</html>
