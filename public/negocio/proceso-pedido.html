<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo - Proceso Pedido</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .content { padding: 20px 20px 100px; }

    .timeline-wrap {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #f3f4f6;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .timeline-title {
      font-size: 13px;
      font-weight: 800;
      color: #374151;
      margin-bottom: 16px;
    }

    .btn-camino {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 380px;
      padding: 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37,99,235,0.3);
      transition: all 0.2s;
    }

    .btn-camino:hover { background: #1d4ed8; }
    .btn-camino:active { transform: translateX(-50%) scale(0.97); }
    .btn-camino:disabled { background: #9ca3af; cursor: not-allowed; }

    .nota {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 10px;
      padding: 0 20px;
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <span class="header-title">Actualiza el proceso del pedido</span>
    <div style="width:30px"></div>
  </div>

  <div class="content">
    <p style="font-size:13px;font-weight:700;color:#374151;margin-bottom:16px;">Proceso del pedido ›</p>

    <div class="timeline-wrap">
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <button class="btn-camino" id="btn-camino" onclick="marcarEnCamino()">
    Pedido en camino
  </button>
  <p class="nota">Da click cuando el repartidor ya haya pasado por el pedido</p>

</div>

<script src="/js/api.js"></script>
<script>
  const user = getUser();
  if (!user || user.tipo !== 'negocio') window.location.href = '/negocio/login.html';

  const pedidoId = localStorage.getItem('pedido_negocio');
  if (!pedidoId) window.location.href = '/negocio/notificaciones.html';

  const pasos = [
    { key: 'pendiente',           label: 'Pendiente' },
    { key: 'recibido',            label: 'Pedido recibido' },
    { key: 'buscando_repartidor', label: 'Buscando repartidor' },
    { key: 'en_proceso',          label: 'Pedido en proceso' },
    { key: 'en_camino',           label: 'Pedido en camino' },
    { key: 'entregado',           label: 'Pedido entregado' },
  ];

  const orden = ['pendiente','recibido','buscando_repartidor','en_proceso','en_camino','entregado'];

  function renderTimeline(estado) {
    const idx = orden.indexOf(estado);
    document.getElementById('timeline').innerHTML = pasos.map((p, i) => {
      const done = i < idx;
      const active = i === idx;
      return `
        <div class="timeline-item ${done ? 'done' : ''} ${active ? 'active' : ''}">
          <div class="timeline-dot"></div>
          <span class="timeline-text">${p.label}</span>
        </div>`;
    }).join('');

    const btn = document.getElementById('btn-camino');
    if (estado === 'en_camino' || estado === 'entregado') {
      btn.disabled = true;
      btn.textContent = estado === 'entregado' ? 'Pedido entregado' : 'Pedido en camino ✓';
    }
  }

  async function cargarEstado() {
    const pedido = await apiGet(`/pedidos/${pedidoId}`);
    renderTimeline(pedido.estado);
  }

  async function marcarEnCamino() {
    const btn = document.getElementById('btn-camino');
    btn.disabled = true;
    btn.textContent = 'Actualizando...';

    const res = await apiPut(`/pedidos/${pedidoId}/estado`, { estado: 'en_camino' });
    if (res.ok) {
      renderTimeline('en_camino');
      btn.textContent = 'Pedido en camino ✓';
    } else {
      btn.disabled = false;
      btn.textContent = 'Pedido en camino';
    }
  }

  cargarEstado();
  setInterval(cargarEstado, 8000);
</script>
</body>
</html>
