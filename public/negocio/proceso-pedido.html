<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo - Proceso Pedido</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .content { padding: 20px 20px 100px; }

    .timeline-wrap {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #f3f4f6;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .timeline-title {
      font-size: 13px;
      font-weight: 800;
      color: #374151;
      margin-bottom: 16px;
    }

    .btn-camino {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 380px;
      padding: 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(37,99,235,0.3);
      transition: all 0.2s;
    }

    .btn-camino:hover { background: #1d4ed8; }
    .btn-camino:active { transform: translateX(-50%) scale(0.97); }
    .btn-camino:disabled { background: #9ca3af; cursor: not-allowed; }

    .nota {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 10px;
      padding: 0 20px;
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <span class="header-title">Actualiza el proceso del pedido</span>
    <div style="width:30px"></div>
  </div>

  <div class="content">
    <p style="font-size:13px;font-weight:700;color:#374151;margin-bottom:16px;" id="proceso-titulo">Proceso del pedido ›</p>

    <div class="timeline-wrap">
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <button class="btn-camino" id="btn-camino" onclick="ejecutarAccion()" disabled>
    Cargando...
  </button>
  <p class="nota" id="nota"></p>

</div>

<script src="/js/api.js"></script>
<script>
  const user = getUser();
  if (!user || user.tipo !== 'negocio') window.location.href = '/negocio/login.html';

  const pedidoId = localStorage.getItem('pedido_negocio');
  if (!pedidoId) window.location.href = '/negocio/notificaciones.html';

  // Pasos según el tipo de entrega. Recoger se salta todo lo del repartidor.
  const PASOS = {
    domicilio: [
      { key: 'pendiente',           label: 'Pendiente' },
      { key: 'recibido',            label: 'Pedido recibido' },
      { key: 'buscando_repartidor', label: 'Buscando repartidor' },
      { key: 'en_proceso',          label: 'Pedido en proceso' },
      { key: 'en_camino',           label: 'Pedido en camino' },
      { key: 'entregado',           label: 'Pedido entregado' },
    ],
    recoger: [
      { key: 'pendiente',     label: 'Pendiente' },
      { key: 'recibido',      label: 'Pedido recibido' },
      { key: 'en_proceso',    label: 'Pedido en proceso' },
      { key: 'listo_recoger', label: 'Listo para recoger' },
      { key: 'entregado',     label: 'Pedido entregado' },
    ],
  };

  // Siguiente acción del negocio según tipo de entrega y estado actual
  const ACCIONES = {
    domicilio: {
      recibido:            { texto: 'Buscar repartidor',  nota: 'Da click para empezar a buscar un repartidor', estado: 'buscando_repartidor' },
      buscando_repartidor: { texto: 'Ya tengo repartidor', nota: 'Da click cuando ya tengas un repartidor para este pedido', repartidor: true },
      en_proceso:          { texto: 'Pedido en camino',   nota: 'Da click cuando el repartidor ya haya pasado por el pedido', estado: 'en_camino' },
      en_camino:           { texto: 'Pedido entregado',   nota: 'Da click cuando el cliente ya haya recibido su pedido', estado: 'entregado' },
    },
    recoger: {
      recibido:      { texto: 'Listo para recoger', nota: 'Da click cuando el pedido esté listo para que el cliente pase por él', estado: 'listo_recoger' },
      en_proceso:    { texto: 'Listo para recoger', nota: 'Da click cuando el pedido esté listo para que el cliente pase por él', estado: 'listo_recoger' },
      listo_recoger: { texto: 'Pedido entregado',   nota: 'Da click cuando el cliente haya recogido su pedido', estado: 'entregado' },
    },
  };

  let pedidoActual = null;
  let actualizando = false;

  function render(pedido) {
    const tipo = pedido.tipo_entrega === 'recoger' ? 'recoger' : 'domicilio';
    const pasos = PASOS[tipo];
    const idx = pasos.findIndex(p => p.key === pedido.estado);

    document.getElementById('proceso-titulo').textContent =
      `Proceso del pedido (${tipo === 'recoger' ? 'para recoger' : 'a domicilio'}) ›`;

    document.getElementById('timeline').innerHTML = pasos.map((p, i) => {
      const done = i < idx;
      const active = i === idx;
      return `
        <div class="timeline-item ${done ? 'done' : ''} ${active ? 'active' : ''}">
          <div class="timeline-dot"></div>
          <span class="timeline-text">${p.label}</span>
        </div>`;
    }).join('');

    const btn = document.getElementById('btn-camino');
    const nota = document.getElementById('nota');
    const accion = ACCIONES[tipo][pedido.estado];

    if (accion) {
      btn.disabled = false;
      btn.textContent = accion.texto;
      nota.textContent = accion.nota;
    } else {
      btn.disabled = true;
      btn.textContent = pedido.estado === 'entregado' ? 'Pedido entregado ✓'
                      : pedido.estado === 'cancelado' ? 'Pedido cancelado'
                      : getEstadoLabel(pedido.estado);
      nota.textContent = '';
    }
  }

  async function cargarEstado() {
    if (actualizando) return;
    const pedido = await apiGet(`/pedidos/${pedidoId}`);
    if (pedido.error) return;
    pedidoActual = pedido;
    render(pedido);
  }

  async function ejecutarAccion() {
    if (!pedidoActual) return;
    const tipo = pedidoActual.tipo_entrega === 'recoger' ? 'recoger' : 'domicilio';
    const accion = ACCIONES[tipo][pedidoActual.estado];
    if (!accion) return;

    const btn = document.getElementById('btn-camino');
    btn.disabled = true;
    btn.textContent = 'Actualizando...';
    actualizando = true;

    const res = accion.repartidor
      ? await apiPut(`/pedidos/${pedidoId}/repartidor`, {})
      : await apiPut(`/pedidos/${pedidoId}/estado`, { estado: accion.estado });

    actualizando = false;
    if (!res.ok) alert(res.error || 'Error al actualizar el pedido');
    await cargarEstado();
  }

  cargarEstado();
  setInterval(cargarEstado, 8000);
</script>
</body>
</html>
