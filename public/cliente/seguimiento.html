<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo - Seguimiento</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .content { padding: 20px 20px 100px; }

    .timeline-wrap {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #f3f4f6;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .timeline-title {
      font-size: 13px;
      font-weight: 800;
      color: #374151;
      margin-bottom: 16px;
    }

    .btn-cancelar {
      width: 100%;
      padding: 15px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-cancelar:hover { background: #15803d; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <span class="header-title">Mis Pedidos</span>
    <div style="width:30px"></div>
  </div>

  <div class="content">
    <p style="font-size:13px;font-weight:700;color:#374151;margin-bottom:16px;">Sigue tu pedido ›</p>

    <div class="timeline-wrap">
      <div class="timeline" id="timeline"></div>
    </div>

    <button class="btn-cancelar" onclick="cancelarPedido()">Cancelar pedido</button>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='/cliente/home.html'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
    </button>
    <button class="nav-btn" onclick="window.location.href='/cliente/carrito.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
      </svg>
      Carrito
    </button>
    <button class="nav-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
      Pedidos
    </button>
    <button class="nav-btn" onclick="window.location.href='/cliente/notificaciones.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      Alertas
    </button>
    <button class="nav-btn" onclick="window.location.href='/cliente/home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      Perfil
    </button>
  </nav>

</div>

<script src="/js/api.js"></script>
<script>
  const user = getUser();
  if (!user || user.tipo !== 'cliente') window.location.href = '/cliente/login.html';

  const pedidoData = JSON.parse(localStorage.getItem('pedido_seguimiento') || '{}');

  const pasos = [
    { key: 'pendiente',            label: 'Pendiente' },
    { key: 'recibido',             label: 'Tu pedido fue recibido por el negocio' },
    { key: 'buscando_repartidor',  label: 'Buscando repartidor' },
    { key: 'en_proceso',           label: 'Tu pedido está en proceso' },
    { key: 'en_camino',            label: 'Tu pedido está en camino' },
    { key: 'entregado',            label: 'Tu pedido fue entregado' },
  ];

  const orden = ['pendiente','recibido','buscando_repartidor','en_proceso','en_camino','entregado'];

  function renderTimeline(estado) {
    const idx = orden.indexOf(estado);
    const tl = document.getElementById('timeline');
    tl.innerHTML = pasos.map((p, i) => {
      const done = i < idx;
      const active = i === idx;
      return `
        <div class="timeline-item ${done ? 'done' : ''} ${active ? 'active' : ''}">
          <div class="timeline-dot"></div>
          <span class="timeline-text">${p.label}</span>
        </div>`;
    }).join('');
  }

  async function actualizarEstado() {
    if (!pedidoData.id) return;
    const pedido = await apiGet(`/pedidos/${pedidoData.id}`);
    if (pedido.estado === 'entregado') {
      localStorage.setItem('pedido_seguimiento', JSON.stringify({ ...pedidoData, estado: 'entregado' }));
      window.location.href = '/cliente/pedido-entregado.html';
      return;
    }
    renderTimeline(pedido.estado);
  }

  async function cancelarPedido() {
    if (!confirm('¿Estás seguro que deseas cancelar tu pedido?')) return;
    const res = await apiPut(`/pedidos/${pedidoData.id}/estado`, { estado: 'cancelado' });
    if (res.ok) {
      alert('Pedido cancelado');
      window.location.href = '/cliente/pedidos.html';
    }
  }

  renderTimeline(pedidoData.estado || 'pendiente');
  actualizarEstado();
  setInterval(actualizarEstado, 8000);
</script>
</body>
</html>
