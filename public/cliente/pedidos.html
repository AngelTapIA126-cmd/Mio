<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo - Mis Pedidos</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .content { padding: 16px 20px 90px; }

    .pedido-card {
      background: #fff;
      border: 1px solid #f3f4f6;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .pedido-card:active { transform: scale(0.98); }

    .pedido-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .badge-pendiente { background: #fef9c3; color: #854d0e; }
    .badge-recibido { background: #dbeafe; color: #1e40af; }
    .badge-buscando_repartidor { background: #f3e8ff; color: #6b21a8; }
    .badge-en_proceso { background: #ffedd5; color: #9a3412; }
    .badge-en_camino { background: #dcfce7; color: #14532d; }
    .badge-listo_recoger { background: #ffedd5; color: #9a3412; }
    .badge-entregado { background: #dcfce7; color: #14532d; }
    .badge-cancelado { background: #fee2e2; color: #991b1b; }

    .pedido-titulo {
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .pedido-sub {
      font-size: 12px;
      color: #6b7280;
      font-weight: 600;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      gap: 12px;
      color: #6b7280;
    }

    .empty-state p { font-size: 15px; font-weight: 700; }
    .empty-state span { font-size: 13px; text-align: center; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <span class="header-title">Mis Pedidos</span>
    <div style="width:30px"></div>
  </div>

  <div class="content">
    <p style="font-size:13px;font-weight:700;color:#374151;margin-bottom:14px;">Sigue tu pedido ›</p>
    <div id="pedidos-list">
      <div class="loading"><div class="spinner"></div> Cargando...</div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='/cliente/home.html'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
    </button>
    <button class="nav-btn" onclick="window.location.href='/cliente/carrito.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
      </svg>
      Carrito
    </button>
    <button class="nav-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
      Pedidos
    </button>
    <button class="nav-btn" onclick="window.location.href='/cliente/notificaciones.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      Alertas
    </button>
    <button class="nav-btn" onclick="window.location.href='/cliente/home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      Perfil
    </button>
  </nav>

</div>

<script src="/js/api.js"></script>
<script>
  const user = getUser();
  if (!user || user.tipo !== 'cliente') window.location.href = '/cliente/login.html';

  const estadoLabels = {
    'pendiente': 'Pendiente',
    'recibido': 'Recibido por negocio',
    'buscando_repartidor': 'Buscando repartidor',
    'en_proceso': 'En proceso',
    'en_camino': 'En camino',
    'listo_recoger': 'Listo para recoger',
    'entregado': 'Entregado',
    'cancelado': 'Cancelado'
  };

  let ultimosPedidos = [];

  async function cargarPedidos() {
    const pedidos = await apiGet('/pedidos/cliente');
    ultimosPedidos = pedidos;
    const list = document.getElementById('pedidos-list');

    if (!pedidos.length) {
      list.innerHTML = `
        <div class="empty-state">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
          <p>Sin pedidos aún</p>
          <span>Haz tu primer pedido desde los negocios disponibles</span>
          <button class="btn btn-blue" style="margin-top:8px;" onclick="window.location.href='/cliente/home.html'">Ver negocios</button>
        </div>`;
      return;
    }

    list.innerHTML = pedidos.map(p => `
      <div class="pedido-card" onclick="verSeguimiento(${p.id})">
        <span class="pedido-badge badge-${p.estado}">${estadoLabels[p.estado] || p.estado}</span>
        <div class="pedido-titulo">${p.estado === 'entregado' ? 'Entregado el ' + formatDate(p.updated_at) : 'Pedido #' + String(p.id).padStart(12, '0')}</div>
        <div class="pedido-sub">${p.negocio_nombre} · $${parseFloat(p.total).toFixed(2)}</div>
      </div>
    `).join('');
  }

  // Domicilio sin repartidor abre el chat; lo demás, seguimiento o entregado
  function verSeguimiento(id) {
    const p = ultimosPedidos.find(x => x.id === id);
    if (p) abrirPedidoCliente(p);
  }

  cargarPedidos();
  // Polling cada 10 segundos
  setInterval(cargarPedidos, 10000);
</script>
</body>
</html>
