<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="/images/ICONO_CLIENTE.png"/>
  <link rel="apple-touch-icon" href="/images/ICONO_CLIENTE.png"/>
  <title>DriverGo - Iniciar Sesión</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .auth-screen { padding: 48px 28px 40px; }
    .logo-svg { width: 48px; height: 48px; }
  </style>
</head>
<body>
<div class="app">
  <div class="auth-screen">

    <div class="auth-logo">
      <div class="auth-logo-row">
        <img src="/images/LOGO_DRIVERGO.PNG" style="height:52px;width:auto;"/>
      </div>
      <h1 class="auth-title">Inicia sesión</h1>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <div class="input-group">
      <label class="input-label">Ingresa tu número de teléfono</label>
      <input type="tel" id="telefono" class="input-field" placeholder="Ej. 999 120 4532"/>
    </div>

    <div class="input-group">
      <label class="input-label">Ingresa tu contraseña</label>
      <input type="password" id="password" class="input-field" placeholder="••••••••••••"/>
    </div>

    <button class="btn btn-blue" id="btn-login" onclick="login()">Continuar</button>

    <!-- Solo en desarrollo (localhost): entra con la cuenta de prueba -->
    <button class="btn" id="btn-login-rapido" onclick="loginRapido()"
      style="display:none; margin-top:10px; background:#eee; color:#333;">⚡ Entrar rápido (cliente de prueba)</button>

    <div class="auth-footer">
      ¿No tienes cuenta? <a href="/cliente/registro.html">Crear cuenta</a>
    </div>

    <p class="auth-terms">
      Al hacer clic en continuar, aceptas nuestros
      <a href="#">Términos de servicio</a> y <a href="#">Política de privacidad</a>
    </p>

  </div>
</div>

<script src="/js/api.js"></script>
<script>
  // Verificar si ya hay sesión
  const user = getUser();
  if (user && user.tipo === 'cliente') window.location.href = '/cliente/home.html';

  async function login() {
    const telefono = document.getElementById('telefono').value.trim();
    const password = document.getElementById('password').value.trim();
    hideError('error-msg');

    if (!telefono || !password) {
      showError('error-msg', 'Por favor llena todos los campos');
      return;
    }

    const btn = document.getElementById('btn-login');
    btn.textContent = 'Cargando...';
    btn.disabled = true;

    const res = await apiPost('/clientes/login', { telefono, password });

    if (res.ok) {
      saveSession(res.token, { id: res.id, nombres: res.nombres, tipo: 'cliente' });
      window.location.href = '/cliente/home.html';
    } else {
      showError('error-msg', res.error || 'Error al iniciar sesión');
      btn.textContent = 'Continuar';
      btn.disabled = false;
    }
  }

  // Login rápido de prueba (solo visible en localhost)
  if (['localhost', '127.0.0.1'].includes(window.location.hostname)) {
    document.getElementById('btn-login-rapido').style.display = 'block';
  }
  function loginRapido() {
    document.getElementById('telefono').value = '5550000001';
    document.getElementById('password').value = '123456';
    login();
  }

  // Enter para login
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
