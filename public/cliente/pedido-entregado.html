<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo - Pedido Entregado</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .content { padding: 20px 20px 100px; }

    .entregado-card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #f3f4f6;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }

    .badge-entregado {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dcfce7;
      color: #14532d;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .entregado-titulo {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #111;
      margin-bottom: 8px;
    }

    .entregado-sub {
      font-size: 13px;
      color: #6b7280;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .devolucion-nota {
      font-size: 12px;
      color: #9ca3af;
      font-style: italic;
      margin-top: 12px;
    }

    .btns-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <button class="back-btn" onclick="window.location.href='/cliente/pedidos.html'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <span class="header-title">Mis Pedidos</span>
    <div style="width:30px"></div>
  </div>

  <div class="content">
    <div class="entregado-card">
      <span class="badge-entregado">
        Entregado ›
      </span>
      <div class="entregado-titulo" id="titulo-entregado">Entregado</div>
      <div class="entregado-sub" id="sub-entregado">
        Tu pedido fue entregado en la dirección indicada.
      </div>
      <div class="devolucion-nota">
        (Puedes devolverlo en un lapso de 20 min)
      </div>
    </div>

    <div class="btns-wrap">
      <button class="btn btn-green" onclick="devolver()">Devolver</button>
      <button class="btn btn-outline" onclick="window.location.href='/cliente/home.html'">Volver a comprar</button>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="window.location.href='/cliente/home.html'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Inicio
    </button>
    <button class="nav-btn" onclick="window.location.href='/cliente/carrito.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
      </svg>
      Carrito
    </button>
    <button class="nav-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
      Pedidos
    </button>
    <button class="nav-btn" onclick="window.location.href='/cliente/notificaciones.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
      </svg>
      Alertas
    </button>
    <button class="nav-btn" onclick="window.location.href='/cliente/home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      Perfil
    </button>
  </nav>

</div>

<script src="/js/api.js"></script>
<script>
  const user = getUser();
  if (!user || user.tipo !== 'cliente') window.location.href = '/cliente/login.html';

  const pedidoData = JSON.parse(localStorage.getItem('pedido_seguimiento') || '{}');

  // Mostrar fecha y dirección
  if (pedidoData.fecha) {
    document.getElementById('titulo-entregado').textContent = 'Entregado el ' + formatDate(pedidoData.fecha);
  }
  if (pedidoData.tipo_entrega === 'recoger') {
    document.getElementById('sub-entregado').textContent =
      'Recogiste tu pedido en ' + (pedidoData.negocio_nombre || 'el negocio');
  } else if (pedidoData.direccion) {
    document.getElementById('sub-entregado').textContent =
      'Tu pedido fue entregado en ' + pedidoData.direccion;
  }

  function devolver() {
    alert('Solicitud de devolución enviada. Un agente se comunicará contigo pronto.');
    window.location.href = '/cliente/pedidos.html';
  }
</script>
</body>
</html>
