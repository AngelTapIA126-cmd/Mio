<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DriverGo - Carrito</title>
  <link rel="icon" type="image/png" href="/images/ICONO_CLIENTE.png"/>
  <link rel="apple-touch-icon" href="/images/ICONO_CLIENTE.png"/>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .content { padding: 16px 20px 100px; }

    .seccion {
      border-bottom: 1px solid #f3f4f6;
      padding: 14px 0;
    }

    .seccion-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .seccion-label {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    .seccion-valor {
      font-size: 13px;
      font-weight: 700;
      color: #111;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .seccion-valor.muted { color: #9ca3af; }

    .tabla-header {
      display: grid;
      grid-template-columns: 60px 1fr auto 32px;
      gap: 10px;
      padding: 10px 0 6px;
      border-bottom: 1px solid #f3f4f6;
    }

    .tabla-header span {
      font-size: 11px;
      font-weight: 800;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .item-row {
      display: grid;
      grid-template-columns: 60px 1fr auto 32px;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #f9fafb;
      align-items: center;
    }

    .item-img {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      background: #f3f4f6;
    }

    .item-img-placeholder {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      background: linear-gradient(135deg, #dbeafe, #dcfce7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .item-info { display: flex; flex-direction: column; gap: 2px; }

    .item-negocio {
      font-size: 10px;
      color: #6b7280;
      font-weight: 600;
    }

    .item-nombre {
      font-size: 13px;
      font-weight: 800;
      color: #111;
    }

    .item-desc {
      font-size: 11px;
      color: #6b7280;
    }

    .item-precio {
      font-size: 14px;
      font-weight: 800;
      color: #111;
      text-align: right;
    }

    .btn-eliminar-item {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn-eliminar-item:hover { background: #fee2e2; }

    .resumen { padding: 16px 0; }

    .resumen-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 13px;
      color: #374151;
      font-weight: 600;
    }

    .resumen-row.total {
      font-size: 16px;
      font-weight: 800;
      color: #111;
      border-top: 2px solid #f3f4f6;
      margin-top: 8px;
      padding-top: 12px;
    }

    .btn-pedido {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 380px;
      padding: 16px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(22,163,74,0.3);
      transition: all 0.2s;
    }

    .btn-pedido:hover { background: #15803d; }
    .btn-pedido:active { transform: translateX(-50%) scale(0.97); }

    .direccion-input {
      margin-top: 8px;
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .direccion-input:focus { border-color: #2563eb; }

    .empty-cart {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 12px;
      color: #6b7280;
    }

    .empty-cart svg { opacity: 0.3; }
    .empty-cart p { font-size: 15px; font-weight: 700; }
    .empty-cart span { font-size: 13px; text-align: center; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <span class="header-title">Pantalla de pago</span>
    <div style="width:30px"></div>
  </div>

  <div class="content" id="content">
    <div class="loading"><div class="spinner"></div> Cargando...</div>
  </div>

  <button class="btn-pedido" id="btn-pedido" onclick="irAlChat()">Ir al chat</button>

</div>

<!-- Overlay + Toast -->
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast" style="position:fixed;">
  <div class="toast-icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
  </div>
  <span class="toast-title" id="toast-title">Pedido realizado</span>
  <button class="btn btn-blue" id="toast-aceptar" style="margin-top:8px;padding:10px 28px;width:auto;">Aceptar</button>
</div>

<script src="/js/api.js"></script>
<script>
  const user = getUser();
  if (!user || user.tipo !== 'cliente') window.location.href = '/cliente/login.html';

  let carrito = JSON.parse(localStorage.getItem('carrito') || '[]');

  function eliminarItem(producto_id) {
    carrito = carrito.filter(i => i.producto_id !== producto_id);
    localStorage.setItem('carrito', JSON.stringify(carrito));
    renderCarrito();
  }

  function renderCarrito() {
    const cont = document.getElementById('content');
    const btn = document.getElementById('btn-pedido');

    if (!carrito.length) {
      btn.style.display = 'none';
      cont.innerHTML = `
        <div class="empty-cart">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
          </svg>
          <p>Tu carrito está vacío</p>
          <span>Agrega productos desde los negocios disponibles</span>
          <button class="btn btn-blue" style="margin-top:8px;" onclick="window.location.href='/cliente/home.html'">Ver negocios</button>
        </div>`;
      return;
    }

    btn.style.display = 'block';
    const subtotal = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
    const envio = 30;
    const impuestos = parseFloat((subtotal * 0.02).toFixed(2));
    const total = subtotal + envio + impuestos;

    cont.innerHTML = `
      <div class="seccion">
        <div class="seccion-row">
          <span class="seccion-label">ENTREGA</span>
          <span class="seccion-valor">$${envio.toFixed(2)} › <small style="color:#6b7280;font-size:11px;">A domicilio | Gratis si pasas a recoger</small></span>
        </div>
      </div>

      <div class="seccion">
        <div class="seccion-row">
          <span class="seccion-label">PAGO</span>
          <span class="seccion-valor">Efectivo</span>
        </div>
      </div>

      <div class="tabla-header">
        <span>ARTÍCULOS</span>
        <span>DESCRIPCIÓN</span>
        <span>PRECIO</span>
        <span></span>
      </div>

      ${carrito.map(item => `
        <div class="item-row">
          ${item.imagen
            ? `<img src="${getImageUrl(item.imagen)}" class="item-img" onerror="this.outerHTML='<div class=\\'item-img-placeholder\\'>🛒</div>'">`
            : `<div class="item-img-placeholder">🛒</div>`}
          <div class="item-info">
            <span class="item-negocio">${item.negocio_nombre}</span>
            <span class="item-nombre">${item.nombre}</span>
            <span class="item-desc">Cantidad: ${item.cantidad}</span>
          </div>
          <span class="item-precio">$${(item.precio * item.cantidad).toFixed(2)}</span>
          <button class="btn-eliminar-item" onclick="eliminarItem(${item.producto_id})">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
            </svg>
          </button>
        </div>
      `).join('')}

      <div class="resumen">
        <div class="resumen-row">
          <span>Subtotal (${carrito.reduce((s,i) => s+i.cantidad, 0)})</span>
          <span>$${subtotal.toFixed(2)}</span>
        </div>
        <div class="resumen-row">
          <span>Total de envío</span>
          <span>$${envio.toFixed(2)}</span>
        </div>
        <div class="resumen-row">
          <span>Impuestos</span>
          <span>$${impuestos.toFixed(2)}</span>
        </div>
        <div class="resumen-row total">
          <span>Total</span>
          <span>$${total.toFixed(2)}</span>
        </div>
      </div>
    `;
  }

  // El tipo de entrega, la dirección y la confirmación se hacen en el chat
  function irAlChat() {
    if (!carrito.length) return;
    localStorage.removeItem('pedido_chat');
    window.location.href = '/cliente/chat.html';
  }

  renderCarrito();
</script>
</body>
</html>
